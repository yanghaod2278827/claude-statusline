name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regression tests
        run: python tests/test_statusline.py

      # Peak/off-peak pricing is evaluated in the provider's billing zone
      # (peak.utc_offset). Running once under UTC proves the result does not
      # depend on the runner's local timezone.
      - name: Regression tests under UTC
        if: runner.os == 'Linux'
        env:
          TZ: UTC
        run: python tests/test_statusline.py
